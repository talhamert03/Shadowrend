# Shadowrend — Godot Android derlemesi (test APK).
# Her push'ta godot/ projesini Godot 4.4.1 ile dışa aktarır ve APK'yı
# "Actions → bu çalıştırma → Artifacts" altına yükler.
name: Android APK

on:
  push:
    paths:
      - "godot/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GODOT_VER: "4.4.1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Godot ve dışa aktarma şablonları (önbellekli)
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VER }}-android-v1

      - name: Godot indir
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o g.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VER}-stable/Godot_v${GODOT_VER}-stable_linux.x86_64.zip"
          unzip -q g.zip && rm g.zip
          curl -sSL -o t.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VER}-stable/Godot_v${GODOT_VER}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VER}.stable
          unzip -q -o -j t.tpz "templates/android_*" "templates/version.txt" -d ~/.local/share/godot/export_templates/${GODOT_VER}.stable/
          rm t.tpz

      - name: Hata ayıklama anahtarı + editör ayarları
        run: |
          keytool -genkeypair -keystore $HOME/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT

      - name: İçe aktar + dışa aktar
        working-directory: godot
        run: |
          G=~/godot/Godot_v${GODOT_VER}-stable_linux.x86_64
          mkdir -p build
          timeout 1200 $G --headless --path . --editor --quit || true
          # paket kontrolü: dışa aktarılan paketi açıp betik hatası arar (ör. hariç tutulan class_name)
          bash ../tools/check/export_check.sh $G 20
          timeout 1200 $G --headless --path . --export-debug "Android" build/shadowrend.apk
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: shadowrend-test-apk
          path: godot/build/shadowrend.apk
          retention-days: 30
