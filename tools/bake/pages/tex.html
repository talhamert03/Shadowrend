<!doctype html>
<meta charset="utf-8">
<title>doku pişirme</title>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
} }
</script>
<script type="module">
/* Oyunun çalışma anında kanvasla ürettiği dokuları (render3d efekt dokuları,
   saha sandığı madalyonları, kalkan rün halkası) web kodunun KENDİSİYLE
   üretip PNG olarak yazar. */
import * as THREE from 'three';
import { Quality } from '/game/perf.js?v=20260930m';
import { Renderer3D } from '/game/render3d.js?v=20260930m';
import { save, canvasPNG, done, importPatched } from './common.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

Quality.init('high', false);
const R = Renderer3D.prototype;
const fake = { renderer: { capabilities: { getMaxAnisotropy: () => 8 } } };
const put = async (name, tex) => {
  const cv = tex.image || tex.source && tex.source.data;
  await save('assets/fx/' + name + '.png', await canvasPNG(cv));
};
(async () => {
  try {
    await put('prop_grain', R._propTexture.call(fake));
    await put('soft_blob', R._softBlobTexture.call(fake));
    await put('glow', R._glowTexture.call(fake));
    await put('flame_sprite', R._flameSpriteTexture.call(fake));
    await put('shock', R._shockTexture.call(fake));
    await put('slash', R._slashTexture.call(fake));
    await put('beam', R._beamTexture.call(fake));
    for (const s of [1, 2, 3]) await put('bolt_' + s, R._boltZigzagTexture.call(fake, s));
    /* hale (gem/heart havuzları) — _buildGemPool içindeki satır içi kanvas */
    {
      const glowCanvas = document.createElement('canvas');
      glowCanvas.width = glowCanvas.height = 128;
      const gctx = glowCanvas.getContext('2d');
      const grad = gctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      grad.addColorStop(0, 'rgba(255,255,255,0.95)');
      grad.addColorStop(0.22, 'rgba(255,255,255,0.42)');
      grad.addColorStop(0.55, 'rgba(255,255,255,0.13)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      gctx.fillStyle = grad;
      gctx.fillRect(0, 0, 128, 128);
      await save('assets/fx/soft_glow.png', await canvasPNG(glowCanvas));
    }
    const FC = await importPatched('/game/fieldChest.js?v=20260930m', ['medal', 'bombBody']);
    for (const k of ['magnet', 'heal', 'shield', 'gold']) await save('assets/art/fieldchest/medal_' + k + '.png', await canvasPNG(FC.medal(k)));
    for (const h of [0, 1]) await save('assets/art/fieldchest/bomb_' + h + '.png', await canvasPNG(FC.bombBody(h)));
    const SD = await importPatched('/game/shieldDome.js?v=20260930m', ['runeTexture']);
    await put('shield_rune', SD.runeTexture());
    /* kalkan kubbesi: panel kafesinin pişmiş verisi + perde/disk köşe renkleri */
    {
      const { ShieldDome } = await import('/game/shieldDome.js?v=20260930m');
      const PM = await import('/game/propModels.js?v=20260930m');
      const d = new ShieldDome(new THREE.MeshBasicMaterial());
      const geo = (g) => ({ pos: Array.from(g.attributes.position.array), col: Array.from(g.attributes.color ? g.attributes.color.array : []),
        idx: g.index ? Array.from(g.index.array) : null });
      const out = { R: PM.SHIELD_R, GEM_Y: PM.GEM_Y, gemY: d._gemY, SQ: 0.84,
        base0: Array.from(d.base0), cent: Array.from(d.cent), bl: Array.from(d.bl), bw: Array.from(d.bw), hy: Array.from(d.hy),
        ph: Array.from(d.ph), sp: Array.from(d.sp), veil: geo(d.veil.geometry), disk: geo(d.disk.geometry) };
      await save('assets/arena/shield_dome.json', JSON.stringify(out));
    }
    /* KAN KALBİ geometrisi (_buildHeartPool: ExtrudeGeometry + center) */
    {
      const sh = new THREE.Shape();
      sh.moveTo(0, -1.0);
      sh.bezierCurveTo(-1.32, 0.12, -0.86, 1.18, 0, 0.5);
      sh.bezierCurveTo(0.86, 1.18, 1.32, 0.12, 0, -1.0);
      const geo = new THREE.ExtrudeGeometry(sh, { depth: 0.5, bevelEnabled: true, bevelThickness: 0.16, bevelSize: 0.16, bevelSegments: 2, curveSegments: 10 });
      geo.center();
      const g = new THREE.Group();
      const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial()); m.name = 'heart'; g.add(m);
      const buf = await new GLTFExporter().parseAsync(g, { binary: true });
      await save('assets/fx/fx_geo.glb', buf);
    }
    done();
  } catch (e) { done(e); }
})();
</script>
